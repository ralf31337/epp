[project]
name = "epp"
version = "0.3.0"
description = "Eltern-Portal parser: Elternbriefe to Markdown, PDFs, summaries, ICS, API, MCP and web app"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "markdownify>=0.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "croniter>=3.0",
    "icalendar>=6.0",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "mcp>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
epp = "epp.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
